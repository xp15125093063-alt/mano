<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>魔审资源下载</title>
    <style>
        /* 基础样式 */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f7fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .card {
            text-align: center;
            background: #ffffff;
            padding: 40px 50px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
            max-width: 420px;
            width: 90%;
            position: relative;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
            font-weight: 700;
        }

        /* 资源下载大按钮 - 每两周在这里修改 href */
        .main-btn {
            display: block;
            padding: 18px;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #007aff, #005bb5);
            border-radius: 12px;
            text-decoration: none;
            margin-bottom: 25px;
            transition: all 0.2s;
            box-shadow: 0 8px 20px rgba(0, 122, 255, 0.25);
        }

        .main-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(0, 122, 255, 0.35);
        }

        /* 底部信息栏 */
        .footer {
            margin-top: 10px;
            padding-top: 20px;
            border-top: 1px dashed #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .qq-text {
            color: #666;
            font-size: 13px;
            text-align: left;
        }

        .qq-number {
            font-weight: 700;
            color: #007aff;
            display: block;
            cursor: pointer;
            text-decoration: underline;
            margin-top: 2px;
        }

        /* 赞助入口按钮 */
        .sponsor-trigger {
            padding: 8px 16px;
            font-size: 13px;
            color: #e67e22;
            border: 1px solid #e67e22;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .sponsor-trigger:hover {
            background-color: #e67e22;
            color: #fff;
        }

        /* 弹窗样式 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 280px;
            text-align: center;
        }

        .option-btn {
            display: block;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            color: white;
        }

        .wechat-btn { background-color: #07c160; }
        .alipay-btn { background-color: #1677ff; }

        .cancel-btn {
            color: #999;
            font-size: 13px;
            cursor: pointer;
            margin-top: 10px;
            display: inline-block;
        }

        /* 复制提示 */
        #toast {
            visibility: hidden;
            background-color: #333;
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
        }
        #toast.show { visibility: visible; }
    </style>
</head>
<body>

    <div class="card">
        <h1>魔审资源下载</h1>
        
        <a href="https://qfile.qq.com/q/yVJlZ9yR6q" class="main-btn" target="_blank">🚀 立即下载资源</a>

        <div class="footer">
            <div class="qq-text">
                官方交流群 (点击复制)<br>
                <span class="qq-number" onclick="copyQQ('1087272881')">1087272881</span>
            </div>
            <div class="sponsor-trigger" onclick="toggleModal(true)">☕ 赞助入口</div>
        </div>
    </div>

    <div class="modal-overlay" id="sponsorModal">
        <div class="modal">
            <h3>请选择赞助方式</h3>
            <a href="https://cdn.phototourl.com/uploads/2026-03-05-3ee00e3d-6db9-40ab-b08e-6ddf2d870364.png" 
               class="option-btn wechat-btn" target="_blank">微信支付</a>
            
            <a href="https://i.ibb.co/GhgPLv9/1772882435671.jpg" 
               class="option-btn alipay-btn" target="_blank">支付宝支付</a>
            
            <div class="cancel-btn" onclick="toggleModal(false)">返回</div>
        </div>
    </div>

    <div id="toast">已复制到剪贴板</div>

    <script>
        function copyQQ(text) {
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.getElementById("toast");
                toast.className = "show";
                setTimeout(() => { toast.className = ""; }, 2000);
            });
        }

        function toggleModal(show) {
            document.getElementById("sponsorModal").style.display = show ? "flex" : "none";
        }

        document.getElementById("sponsorModal").onclick = function(e) {
            if (e.target === this) toggleModal(false);
        };
    </script>

</body>
</html>
